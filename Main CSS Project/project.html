<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project</title>
    <link rel="stylesheet" href="./style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Edu+QLD+Hand:wght@400..700&family=Indie+Flower&family=Oswald:wght@200..700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Syne+Tactile&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background-image: url(./files/image.png);
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;
        background-position: center;
      }
      .outerdash {
        height: 90vh;
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
      }
      .dash {
        min-height: 200px;
        min-width: 800px;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(12px);
        border-radius: 24px;
        font-family: "Oswald", sans-serif;
        text-align: center;
      }

      .input-card {
        min-height: 75px;
        min-width: 150px;
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }

      .dash button {
        border: 0px;
        border-radius: 24px;
        padding: 1rem;
      }
      #search {
        padding: 1rem;
        min-width: 200px;
        min-height: 30px;
        border-radius: 24px;
        border: 1px solid #334155;
        background: #edeaf1;
        color: black;
        outline: none;
      }

      .stat-cards {
        padding: 10px;
        margin: 30px;
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        border-radius: 24px;
        gap: 5px;
      }

      .stats {
        padding: 10px;
        margin: 10px;
        min-width: 150px;
        min-height: 100px;
        background-color: rgba(158, 232, 232, 0.394);
        border-radius: 24px;
        font-size: large;
      }
      h3 {
        color: darkblue;
      }
    </style>
  </head>
  <body>
    <nav class="nav-bar-container">
      <div class="nav-bar-1">
        <a href="./index.html">HOME</a>
        <a href="./skills.html">SKILLS</a>
        <a href="./about.html">ABOUT</a>
        <a href="./project.html">PROJECT</a>
      </div>
      <div class="nav-bar-2">
        <a href="#" id="openLogin">log in</a>
      </div>
    </nav>

    <div id="loginModal" class="modal-overlay">
      <div class="modal-card">
        <span id="closeModal" class="close-btn">&times;</span>
        <h2>Log In</h2>
        <form class="login">
          <input type="text" placeholder="Username or Handle" required />
          <input type="password" placeholder="Password" required />
          <button type="submit" class="submit-button">Log In</button>
        </form>
      </div>
    </div>

    <div class="outerdash">
      <div class="dash">
        <div><h1>Codeforces Stats Tracker</h1></div>
        <div class="input-card">
          <input
            type="search"
            id="search"
            placeholder="Input Codeforces Handle"
          />
          <button id="search-button">Search</button>
        </div>
        <div class="stat-cards">
          <div class="stats">
            <h3>CURRENT RATING</h3>
            <p id="rating">--</p>
          </div>
          <div class="stats">
            <h3>RANK</h3>
            <p id="rank">--</p>
          </div>
          <div class="stats">
            <h3>MAX RATING</h3>
            <p id="max-rating">--</p>
          </div>
          <div class="stats">
            <h3>CONTRIBUTION</h3>
            <p id="contribution">--</p>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
